<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AgroFlight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <style>
      :root { --verde: #1f5130; --verde2: #2d6a3e; --ouro: #e8b10c; --texto: #1b2420; --suave: #6b7671; --borda: #dfe5e1; --erro: #b42318; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--verde); color: var(--texto); }
      #carregador { min-height: 100%; display: grid; place-items: center; padding: 16px; }
      .cartao { width: 100%; max-width: 380px; background: #fff; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.28); padding: 26px 24px; }
      .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .marca img { width: 44px; height: 44px; object-fit: contain; border-radius: 10px; border: 1px solid var(--borda); padding: 3px; background: #fff; }
      .marca h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
      .marca h1 span { color: var(--verde2); }
      .marca p { margin: 2px 0 0; font: 500 10px/1 "JetBrains Mono", monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--suave); }
      label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
      input { width: 100%; height: 40px; border: 1px solid var(--borda); border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; }
      input:focus { outline: 2px solid var(--verde2); outline-offset: 0; border-color: transparent; }
      button { width: 100%; height: 42px; margin-top: 18px; border: 0; border-radius: 8px; background: var(--ouro); color: #1b1b1b; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      .msg { font-size: 13px; margin: 12px 0 0; min-height: 18px; color: var(--suave); }
      .msg.erro { color: var(--erro); }
      .barra { height: 6px; border-radius: 3px; background: #edf1ee; overflow: hidden; margin-top: 14px; }
      .barra i { display: block; height: 100%; width: 0; background: var(--verde2); transition: width .2s; }
      .rodape { font-size: 11px; color: var(--suave); margin-top: 16px; line-height: 1.45; }
      [hidden] { display: none !important; }
    </style>
